name: Build and Deploy to Cloud Run
# Trigger deployment after updating OIDC provider mapping to assertion.sub
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: smartcity-515403
  REGION: asia-south1
  SERVICE_NAME: decision-intel-backend
  REPO_NAME: smart-city-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Detect credential method from GitHub Secrets
      - name: Detect Auth Mode
        id: auth_mode
        env:
          SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_APPLICATION_CREDENTIALS || secrets.GOOGLE_CREDENTIALS || secrets.GCP_CREDENTIALS || secrets.GCP_KEY || secrets.SERVICE_ACCOUNT_KEY || secrets.GCP_SERVICE_ACCOUNT_KEY || secrets.GCP_SECRET_KEY || secrets.SECRET_KEY || '' }}
        run: |
          if [ -n "$SA_KEY" ]; then
            echo "mode=sa" >> "$GITHUB_OUTPUT"
          else
            echo "mode=wif" >> "$GITHUB_OUTPUT"
          fi

      # 2a. Authenticate with Google Cloud using Service Account Key JSON (if provided)
      - name: Google Auth (Service Account Key)
        id: auth_sa
        if: steps.auth_mode.outputs.mode == 'sa'
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GOOGLE_APPLICATION_CREDENTIALS || secrets.GOOGLE_CREDENTIALS || secrets.GCP_CREDENTIALS || secrets.GCP_KEY || secrets.SERVICE_ACCOUNT_KEY || secrets.GCP_SERVICE_ACCOUNT_KEY || secrets.GCP_SECRET_KEY || secrets.SECRET_KEY }}

      # 2b. Authenticate with Google Cloud using Workload Identity Federation
      - name: Google Auth (Workload Identity Federation)
        id: auth_wif
        if: steps.auth_mode.outputs.mode == 'wif'
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: 'projects/1054042324015/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@smartcity-515403.iam.gserviceaccount.com'

      # 3. Setup Docker authentication
      - name: Docker Auth
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth_sa.outputs.access_token || steps.auth_wif.outputs.access_token }}

      # 3. Build, Tag, and Push Docker Image
      - name: Build and Push Container
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} -f ./backend/Dockerfile .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      # 4. Deploy to Google Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: --allow-unauthenticated --port=8080 --service-account=github-deployer@smartcity-515403.iam.gserviceaccount.com

      # 5. Output Public Deployment URL
      - name: Output Cloud Run Deployment URL
        run: |
          echo "=========================================================="
          echo " Google Cloud Run Live URL: ${{ steps.deploy.outputs.url }}"
          echo "=========================================================="
