name: Build and Deploy to Cloud Run
# Trigger deployment after updating OIDC provider mapping to assertion.sub
on:
  push:
    branches:
      - main

env:
  PROJECT_ID: carbon1-499909
  REGION: asia-south1
  SERVICE_NAME: decision-intel-backend
  REPO_NAME: smart-city-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Authenticate with Google Cloud
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          # Workload Identity Provider configuration (configure in GCP)
          workload_identity_provider: 'projects/1039572329634/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@carbon1-499909.iam.gserviceaccount.com'

      # 2. Setup Docker authentication
      - name: Docker Auth
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # 3. Build, Tag, and Push Docker Image
      - name: Build and Push Container
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} -f ./backend/Dockerfile .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      # 4. Deploy to Google Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: --allow-unauthenticated --network=smart-city-vpc --subnet=smart-city-subnet
